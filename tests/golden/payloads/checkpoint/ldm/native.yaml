data:
  params:
    batch_size: 42
    num_workers: 5
    train:
      params:
        size: 8
      target: taming.data.faceshq.FFHQTrain
    validation:
      params:
        size: 256
      target: taming.data.faceshq.FFHQValidation
    wrap: false
  target: main.DataModuleFromConfig
lightning:
  callbacks:
    image_logger:
      params:
        batch_frequency: 5000
        increase_log_steps: false
        max_images: 8
      target: main.ImageLogger
  trainer:
    benchmark: true
model:
  base_learning_rate: 2.0e-06
  params:
    channels: 2
    cond_stage_config: __is_unconditional__
    first_stage_config:
      params:
        ddconfig:
          attn_resolutions: []
          ch: 32
          ch_mult:
          - 1
          - 2
          double_z: true
          dropout: 0.0
          in_channels: 3
          num_res_blocks: 1
          out_ch: 3
          resolution: 8
          z_channels: 2
        embed_dim: 2
        lossconfig:
          target: torch.nn.Identity
      target: ldm.models.autoencoder.AutoencoderKL
    first_stage_key: image
    image_size: 4
    linear_end: 0.0195
    linear_start: 0.0015
    log_every_t: 200
    monitor: val/loss_simple_ema
    num_timesteps_cond: 1
    scale_by_std: true
    timesteps: 10
    unet_config:
      params:
        attention_resolutions: []
        channel_mult:
        - 1
        image_size: 4
        in_channels: 2
        model_channels: 32
        num_heads: 4
        num_res_blocks: 0
        out_channels: 2
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
  target: ldm.models.diffusion.ddpm.LatentDiffusion
