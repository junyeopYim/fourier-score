name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Epoch-0 equivalence contracts read tag pre-template-refactor.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.8"
          python-version: "3.11"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --all-extras
      - name: Unit and integration tests
        run: uv run --no-sync python -m pytest -q
      - name: CPU training and sampling diagnostic
        run: uv run --no-sync python scripts/doctor.py --device cpu --output saved/ci/doctor.json
      - name: Notebook source checks
        run: uv run --no-sync python scripts/check_notebooks.py
      - name: Execute notebooks with fresh CPU smoke runs
        run: uv run --no-sync python scripts/check_notebooks.py --execute
      - name: Regenerate analytical figures without datasets
        run: |
          uv run --no-sync python scripts/plot_method.py --output saved/figure-check
          uv run --no-sync python scripts/plot_diagnostics.py --output saved/figure-check
      - name: Retain diagnostics and executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-reproducibility-checks
          path: |
            saved/ci
            saved/notebook_checks
            saved/gmm_oracle/smoke
            saved/figure-check
          if-no-files-found: ignore
          retention-days: 7
