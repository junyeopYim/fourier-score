[project]
name = "fourier-image-template"
version = "0.1.0"
description = "Fixed Gaussian reference scores and normalized neural residuals for diffusion models"
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "numpy>=1.26.4,<3",
  "pillow>=10.4,<14",
]

[project.optional-dependencies]
metrics = ["torch-fidelity>=0.3.0,<0.4"]
tensorboard = ["tensorboard>=2.18,<3"]
ldm = ["einops>=0.8.1,<0.9", "pyyaml>=6.0.2,<7", "opencv-python-headless>=4.10,<5"]
datasets = ["gdown>=5.2,<6", "lmdb>=1.6,<3"]
figures = ["matplotlib>=3.10,<4"]
notebooks = ["jupyterlab>=4.4,<5", "ipykernel>=6.29,<8", "nbconvert>=7.16,<8", "matplotlib>=3.10,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["mps: requires Apple MPS hardware", "cuda: requires NVIDIA CUDA hardware"]
